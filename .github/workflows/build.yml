name: Build & Test

on: pull_request

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.repository == 'ocf/ocflib'
    name: Build & Test
    runs-on: ci-ocf-ocflib
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Nix develop
        run: nix run github:nicknovitski/nix-develop/9be7cfb4b10451d3390a75dc18ad0465bed4932a
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install
      - name: Run tests
        run: |
          poetry run pytest
      - name: Build package 
        run: |
          poetry build
